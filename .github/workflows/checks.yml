# Free checks on every push and pull request; the browser suite runs on demand.
# Paid model evals (`claude plugin eval`) never run here.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      browser:
        description: Also run behavior.mjs and verify-recipes in headless Chromium (about 40 minutes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: plugins/awards
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/awards/recipes/package-lock.json
      - name: Install recipe dependencies
        working-directory: plugins/awards/recipes
        run: npm ci --no-audit --no-fund
      - name: Versions, pins, copies and counts in sync
        run: node scripts/check-sync.mjs
      - name: Every reference resolves
        run: node scripts/lint-refs.mjs
      - name: Graders fail on untouched input
        run: node evals/selftest.mjs
      - name: Route hint matches the eval graders
        run: node scripts/route-hint.mjs --selftest
      - name: Jury evidence, visual library and layout self-tests
        run: |
          node evals/jury-evidence-selftest.mjs
          node evals/visual-library-selftest.mjs
          node recipes/_shared/verify-layout.test.mjs
      - name: Recipes audit free of P0–P2
        run: |
          node scripts/audit.mjs recipes --json --no-write > "$RUNNER_TEMP/audit.json" || true
          node -e "const r = require(process.argv[1]); console.log('P0 %d · P1 %d · P2 %d · P3 %d', r.summary.P0, r.summary.P1, r.summary.P2, r.summary.P3); for (const f of r.findings.filter((f) => f.severity !== 'P3')) console.log(f.severity, f.rule, f.file + (f.line ? ':' + f.line : ''), f.message); process.exit(r.summary.P0 + r.summary.P1 + r.summary.P2 ? 1 : 0);" "$RUNNER_TEMP/audit.json"
      - name: Framework adapters parse and import only pinned libraries
        run: node scripts/check-adapters.mjs
      - name: Recipes build
        working-directory: plugins/awards/recipes
        run: npm run build
      - name: Plugin and marketplace manifests validate
        working-directory: .
        run: |
          npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.308
          claude plugin validate plugins/awards
          claude plugin validate .

  browser:
    name: browser (behavior and recipe verification)
    if: github.event_name == 'workflow_dispatch' && inputs.browser
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: plugins/awards
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/awards/recipes/package-lock.json
      - name: Install recipe dependencies
        working-directory: plugins/awards/recipes
        run: npm ci --no-audit --no-fund
      - name: Install the pinned Playwright's Chromium
        working-directory: plugins/awards/recipes
        run: npx playwright install --with-deps chromium
      - name: Behavior checks (serial, never beside verify-recipes)
        run: node evals/behavior.mjs
      - name: Verify every recipe in headless Chromium
        run: node scripts/verify-recipes.mjs
      - name: Keep the verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recipe-verification
          path: plugins/awards/recipes/_verify/
          if-no-files-found: ignore
