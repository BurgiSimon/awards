<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Form and Sound — fictional event poster</title>
  <desc id="desc">A coral disc crosses dark concentric arcs on a cream field. Bold type announces Form and Sound, 16–18 October 2026.</desc>
  <rect width="900" height="1200" fill="#f0ecd8"/>
  <g fill="none" stroke="#232823" stroke-width="22">
    <path d="M-60 705a390 390 0 0 1 780 0"/>
    <path d="M18 705a312 312 0 0 1 624 0"/>
    <path d="M96 705a234 234 0 0 1 468 0"/>
    <path d="M174 705a156 156 0 0 1 312 0"/>
    <path d="M252 705a78 78 0 0 1 156 0"/>
  </g>
  <circle cx="655" cy="628" r="176" fill="#dc5134"/>
  <path d="M70 760h760" stroke="#232823" stroke-width="3"/>
  <g fill="#232823" font-family="Arial, Helvetica, sans-serif">
    <text x="65" y="155" font-size="110" font-weight="700" letter-spacing="-6">FORM</text>
    <text x="65" y="274" font-size="110" font-weight="700" letter-spacing="-6">&amp; SOUND</text>
    <text x="70" y="835" font-size="30" letter-spacing="3">16—18 OCTOBER 2026</text>
    <text x="70" y="914" font-size="44" font-weight="700">THREE DAYS OF</text>
    <text x="70" y="969" font-size="44" font-weight="700">MAKING CONNECTIONS</text>
    <text x="70" y="1060" font-size="25">THE RESONANCE HALL · BELLWICK</text>
    <text x="70" y="1137" font-size="19" letter-spacing="1">FICTIONAL EVENT / SYNTHETIC DEMONSTRATION</text>
  </g>
